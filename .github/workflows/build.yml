name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
          cat app_src/AppLock_Engine/settings.gradle.kts
      - name: Build APK without Capacitor
        run: |
          cd app_src/AppLock_Engine
          chmod +x gradlew
          # settings থেকে capacitor মডিউল বাদ দাও
          sed -i '/applock-capacitor/d' settings.gradle.kts
          cat settings.gradle.kts
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
