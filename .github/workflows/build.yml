name: Build AAR
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
      - name: Build AAR
        run: |
          cd app_src/AppLock_Engine
          chmod +x gradlew
          sed -i '/applock-capacitor/d' settings.gradle.kts
          ./gradlew assembleDebug --stacktrace
      - name: Find AAR
        run: |
          find app_src -name "*.aar"
          cp app_src/AppLock_Engine/applock/build/outputs/aar/applock-debug.aar ./applock-debug.aar
          ls -lh ./applock-debug.aar
      - name: Make Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AppLock Test ${{ github.run_number }}
          files: applock-debug.aar
