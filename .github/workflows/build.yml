name: Build AppLock AAR

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip source
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d app_src
          chmod +x app_src/AppLock_Engine/gradlew

      - name: Build AAR (only :applock, no capacitor, no demo app)
        working-directory: app_src/AppLock_Engine
        run: ./gradlew :applock:assemblePlayDebug :applock:assembleFullDebug --stacktrace

      - name: Find AAR
        run: |
          mkdir -p out
          D=app_src/AppLock_Engine/applock/build/outputs/aar
          ls -l "$D"
          cp "$D/applock-play-debug.aar" out/applock-debug.aar
          cp "$D/applock-full-debug.aar" out/applock-full-debug.aar
          ls -l out

      - name: Make Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "applock-debug-${{ github.run_number }}" \
            out/applock-debug.aar out/applock-full-debug.aar \
            --title "AppLock debug AAR #${{ github.run_number }}" \
            --notes "applock-debug.aar = play flavor. applock-full-debug.aar = full flavor (optional Fast Mode). Debug build, not device-tested." \
            --prerelease
