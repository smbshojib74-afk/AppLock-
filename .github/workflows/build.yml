name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
          ls app_src
      - name: Install dependencies
        run: |
          cd app_src
          PROJECT=$(find . -maxdepth 3 -name "package.json" | head -n 1 | xargs dirname)
          echo "Project in $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          cd "$PROJECT"
          npm install
          npx cap sync android || true
      - name: Build APK
        run: |
          cd app_src/$PROJECT_DIR
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
