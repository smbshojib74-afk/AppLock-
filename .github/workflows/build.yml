name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
          ls -R app_src | head -n 200
      - name: Install and Build APK
        run: |
          cd app_src
          ROOT=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Found project in: $ROOT"
          if [ -z "$ROOT" ]; then
            echo "package.json NOT FOUND"
            ls -R
            exit 1
          fi
          cd "$ROOT"
          pwd
          ls -la
          npm install
          npx cap sync android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
