name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
      - name: Build APK without Capacitor
        run: |
          cd app_src/AppLock_Engine
          chmod +x gradlew
          sed -i '/applock-capacitor/d' settings.gradle.kts
          ./gradlew :app:assembleDebug --stacktrace
      - name: Find APK
        run: |
          find app_src -name "*.apk" -o -name "*.aab" -o -name "*.aar"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-APK
          path: app_src/AppLock_Engine/app/build/outputs/apk/debug/*.apk
