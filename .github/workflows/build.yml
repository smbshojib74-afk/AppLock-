name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip source
        run: |
          mv "AppLock Engine Source zip" source.zip
          unzip -o source.zip -d app_src
      - name: Build All
        run: |
          cd app_src/AppLock_Engine
          chmod +x gradlew
          sed -i '/applock-capacitor/d' settings.gradle.kts
          ./gradlew assembleDebug --stacktrace
      - name: Find All Outputs
        run: |
          echo "=== ALL APK / AAR ==="
          find app_src -name "*.apk" -o -name "*.aab" -o -name "*.aar"
          echo "=== ALL OUTPUTS ==="
          ls -R app_src/AppLock_Engine/app/build/outputs/ || true
          ls -R app_src/AppLock_Engine/applock/build/outputs/ || true
      - name: Upload Everything
        uses: actions/upload-artifact@v5
        with:
          name: AppLock-Build
          path: app_src/AppLock_Engine/**/build/outputs/**/*
